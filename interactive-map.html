<!DOCTYPE html>
<html lang="en" class="map-page-html">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="mapPage.pageTitle">Interactive Map • Far East Russia</title>
  <meta name="description" data-i18n-attr="content:mapPage.metaDesc"
    content="High-precision interactive map viewer for the Far East Russia ETS2 map mod.">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="assets/css/global.css">
  <script src="assets/theme-init.js"></script>
</head>

<body class="map-page-body">
  <header class="header" id="site-header" aria-label="Top Navigation"></header>

  <main class="map-app-container" id="map-app-container">
    <!-- Map Sector Synchronizing Loader -->
    <div id="loading-screen" class="map-loader">
      <div class="spinner"></div>
      <p class="map-loading-text" data-i18n="mapPage.loading">SYNCHRONIZING MAP SECTORS...</p>
    </div>

    <!-- Floating Top-Left Unified HUD & Legend -->
    <div class="map-floating-hud-tl">
      <div class="map-hud-badge">
        <span class="map-hud-title" id="map-hud-title">WEB MAP VERSION 2</span>
        <div class="map-hud-legend-divider"></div>
        <div class="map-hud-legend-items">
          <div class="map-legend-item">
            <span class="map-swatch" style="background:#facc15; border:1.5px solid #ea580c;"></span>
            <span class="map-legend-name" data-i18n="mapPage.tierRoads">Roads</span>
          </div>
          <div class="map-legend-item">
            <span class="map-swatch" style="background:#d4a373; border-top:2.5px dashed #5c3a21; border-bottom:1px solid #090a0f;"></span>
            <span class="map-legend-name" data-i18n="mapPage.tierSecret">Secret Tracks</span>
          </div>
          <div class="map-legend-item">
            <span class="map-swatch map-swatch-dashed" style="border-color:#0284c7;"></span>
            <span class="map-legend-name" data-i18n="mapPage.tierFerry">Ferry Crossing</span>
          </div>
          <div class="map-legend-item">
            <span class="map-swatch map-swatch-glow" style="background:#00e5ff;"></span>
            <span class="map-legend-name" data-i18n="mapPage.tierStreetview">Street View</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Floating Top-Right Zoom & Fit Controls -->
    <div class="map-floating-hud-tr">
      <div class="map-btn-group-vertical">
        <button type="button" class="map-icon-btn" id="btn-zoom-in" title="Zoom In" aria-label="Zoom In">+</button>
        <button type="button" class="map-icon-btn" id="btn-zoom-out" title="Zoom Out" aria-label="Zoom Out">−</button>
        <button type="button" class="map-icon-btn" id="btn-zoom-fit" title="Fit Map to View" aria-label="Fit Map to View"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
      </div>
    </div>

    <!-- Interactive Canvas Engine -->
    <canvas id="map-canvas"></canvas>

    <!-- Floating Bottom-Left Scale Bar -->
    <div class="map-floating-hud-bl">
      <div class="map-scale-bar-container" id="map-scale-bar-container">
        <div class="map-scale-line" id="map-scale-line"></div>
        <span class="map-scale-label" id="map-scale-label">100 km</span>
      </div>
    </div>

    <!-- Floating Bottom-Right Background Attribution -->
    <div class="map-floating-hud-br">
      <a href="https://www.leobmods.net/mod?id=ets2-global-background-map" target="_blank" rel="noopener noreferrer" class="map-attribution-link">
        Map BG: Leobmods ETS2 Global Background Map
      </a>
    </div>

    <!-- Floating Bottom-Center Layers & Version Bar -->
    <div class="map-layers-bar">
      <label class="map-toggle-item">
        <input type="checkbox" id="toggle-background" checked>
        <span data-i18n="mapPage.background">Background</span>
      </label>
      <span class="map-toggle-sep"></span>
      <label class="map-toggle-item">
        <input type="checkbox" id="toggle-streetview" checked>
        <span data-i18n="mapPage.streetView">Street View</span>
      </label>
      <span class="map-toggle-sep"></span>
      <label class="map-toggle-item">
        <span data-i18n="mapPage.datasetVersion">Version:</span>
        <select id="map-version-select" class="map-version-select">
          <option value="V2" selected data-i18n="mapPage.version2">Web Map Version 2</option>
          <option value="V1" data-i18n="mapPage.version1">Web Map Version 1</option>
        </select>
      </label>
      <span class="map-toggle-sep mobile-hide"></span>
      <span class="map-hint mobile-hide" data-i18n="mapPage.rightClickHint">Right-click for coordinates</span>
    </div>

    <!-- Context Menu / Coordinates popup -->
    <div id="ctx-menu" class="map-ctx-menu">
      <div class="map-ctx-title" data-i18n="mapPage.coords">Map Coordinates</div>
      <div id="coords-display" class="map-ctx-coords">0, 0</div>
      <div class="map-ctx-disclaimer" data-i18n="mapPage.approxDisclaimer">Approximate location</div>
      <button type="button" id="copy-coords-btn" class="map-btn map-btn-primary" onclick="copyCoords()" data-i18n="mapPage.copy">Copy to Clipboard</button>
    </div>
  </main>

  <!-- Streetview Modal -->
  <div id="streetview-modal"
    style="position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 200000; display: none; padding: 0;">
    <div
      style="position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000;">

      <!-- Main Image -->
      <img id="modal-streetview-img" src=""
        style="width: 100%; height: 100%; object-fit: contain; zoom: 1.05; transition: opacity 0.3s ease; opacity: 1;">

      <!-- Top Left HUD -->
      <div
        style="position: absolute; top: 24px; left: 24px; z-index: 2001; background: rgba(0,0,0,0.75); backdrop-filter: blur(25px); padding: 16px 24px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); color: white; user-select: none; display: flex; align-items: center; gap: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);">
        <div
          style="width: 44px; height: 44px; background: linear-gradient(135deg, #FFD700, #F39C12); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-size: 20px; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        <div>
          <h2
            style="margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.5px; display: flex; align-items: center; gap: 10px; font-family: sans-serif;">
            <span data-i18n="mapPage.svTitle">Far East Russia Street View</span> <span
              style="font-size: 10px; background: rgba(255,255,255,0.2); padding: 3px 8px; border-radius: 6px; letter-spacing: 1px; vertical-align: middle;">BETA</span>
          </h2>
          <p id="sv-hud-subtitle"
            style="margin: 4px 0 0 0; font-size: 13px; color: rgba(255,255,255,0.8); font-weight: 500; font-family: sans-serif;">
          </p>
        </div>
      </div>

      <!-- Close Button -->
      <button onclick="closeModal('streetview-modal')"
        style="position: absolute; top: 30px; right: 30px; z-index: 2001; background: rgba(14,14,14,0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); color: #fff; width: 54px; height: 54px; border-radius: 50%; font-size: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 10px 40px rgba(0,0,0,0.4);"
        onmouseover="this.style.background='rgba(255,255,255,0.1)';this.style.transform='scale(1.05)'"
        onmouseout="this.style.background='rgba(14,14,14,0.7)';this.style.transform='scale(1)'">
        &times;
      </button>

      <!-- Navigation Overlay Container (SVG Arrows) -->
      <div id="streetview-arrows-overlay"
        style="position: absolute; inset: 0; pointer-events: none; z-index: 2000;">
      </div>

      <!-- Minimap Container -->
      <div
        style="position: absolute; bottom: 30px; left: 30px; z-index: 2001; width: 280px; height: 200px; background: rgba(0,0,0,0.7); backdrop-filter: blur(15px); border: 2px solid rgba(255,255,255,0.05); border-radius: 12px; overflow: hidden; box-shadow: 0 10px 50px rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center;">
        <canvas id="sv-minimap" width="280" height="200"
          style="width: 100%; height: 100%; display: block;"></canvas>
      </div>
    </div>
  </div>

  <script src="assets/site-data.js"></script>
  <script src="assets/i18n.js"></script>
  <script src="assets/site-renderer.js"></script>
  <script src="assets/interactive-map.js"></script>

  <script>
    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function copyCoords() {
      const display = document.getElementById('coords-display');
      const text = display.innerText;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copy-coords-btn');
        if (!btn) return;
        const originalText = btn.innerText;
        const copiedLabel = (window.I18N && window.I18N.t)
          ? window.I18N.t('mapPage.copied')
          : 'COPIED!';
        btn.innerText = copiedLabel;
        btn.style.background = '#2ecc71';
        btn.style.color = '#fff';
        setTimeout(() => {
          if (window.I18N && window.I18N.t) {
            btn.innerText = window.I18N.t('mapPage.copy');
          } else {
            btn.innerText = originalText;
          }
          btn.style.background = '';
          btn.style.color = '';
        }, 1500);
      });
    }
  </script>
</body>

</html>
